# Add to the internal gateway's server block for /registration-admin/.
location /registration-admin-api/ip/ {
    proxy_pass https://10.8.10.1/regist-v3/;
    proxy_set_header Host oryjk.cn;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name oryjk.cn;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    client_max_body_size 20m;
}

location /registration-admin-api/domain/ {
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $registration_admin_domain oryjk.cn;
    rewrite ^/registration-admin-api/domain/(.*)$ /regist-v3/$1 break;
    proxy_pass https://$registration_admin_domain:82;
    proxy_set_header Host oryjk.cn:82;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_ssl_name oryjk.cn;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    client_max_body_size 20m;
}
