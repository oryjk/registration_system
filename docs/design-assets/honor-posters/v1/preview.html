<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>荣誉海报 · 背景选择设计</title>
<style>
:root{--page:#fffffe;--surface:#fffffe;--text:#00214d;--muted:#1b2d45;--line:#e4eaf2;--accent:#00ebc7;--soft:#e8f5ee;--radius:20px;--shadow:0 12px 40px #18376410}
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #00b79a;outline-offset:4px}header{max-width:1080px;margin:0 auto;padding:36px 28px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;font-weight:600;margin:8px 0}p{line-height:1.65;margin:8px 0;color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:#526174}.design-note{font-size:12px;max-width:270px}.layout{max-width:1080px;margin:auto;padding:0 28px 44px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,440px);gap:28px;align-items:start}.stage{border-radius:28px;background:#e9eef0;padding:26px;display:flex;justify-content:center}.poster{width:340px;aspect-ratio:2/3;position:relative;overflow:hidden;background:url(pitch.png) center/cover;color:#00214d;box-shadow:0 10px 32px #00214d12;flex-shrink:0}.poster[data-theme=gold]{background-image:url(gold.png)}.poster[data-theme=night]{background-image:url(night.png);color:#fffffe}.poster-content{position:absolute;left:14%;right:14%;top:14%;height:64%;display:flex;flex-direction:column;align-items:center;text-align:center}.year{font-size:12px;letter-spacing:3px;opacity:.72}.identity{margin-top:20px;position:relative}.avatar{width:64px;height:64px;border:3px solid #ffffff;box-shadow:0 4px 16px #00214d12;border-radius:20px;background:#d8e9e4;color:#226342;display:grid;place-items:center;font-size:28px}.crown{position:absolute;top:-18px;left:23px;width:25px;height:25px;display:none}.member .crown{display:block}.member .avatar{border-color:#d1ad5c}.name{font-size:21px;line-height:1.3;margin-top:12px;font-weight:600;max-width:100%;overflow-wrap:anywhere}.team{font-size:11px;opacity:.76;margin-top:6px;max-width:100%;overflow-wrap:anywhere}.points-label{font-size:12px;margin-top:24px;opacity:.78}.points{font-size:65px;line-height:1.15;font-weight:600;letter-spacing:-2px;font-variant-numeric:tabular-nums}.points small{font-size:15px;font-weight:400;letter-spacing:0;margin-left:6px}.honor{font-size:11px;padding:6px 12px;border-radius:20px;background:#ffffffab;color:#805414;display:none;margin-top:5px}.top-three .honor{display:block}.motto{font-size:12px;line-height:1.6;margin-top:12px;opacity:.85}.scan-panel{margin-top:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;background:#fffffefa;color:#00214d;border-radius:13px;width:100%;text-align:left}.code-space{width:47px;height:47px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px dashed #c6d2df;color:#526174;border-radius:8px;text-align:center;font-size:9px;line-height:1.5}.scan-title{font-size:11px;font-weight:600}.scan-caption{font-size:9px;margin-top:4px;color:#526174;line-height:1.4}.controls{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}h2{font-size:20px;font-weight:600;margin:0 0 8px}.caption{font-size:13px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.choice{border:2px solid transparent;padding:5px;border-radius:16px;background:transparent;color:var(--text);text-align:center}.choice[aria-pressed=true]{border-color:#00b79a;background:#e8f5ee}.choice img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px}.choice span{display:block;margin-top:8px;font-size:12px;white-space:nowrap}.choice small{display:block;font-size:10px;color:#526174;margin-top:4px}.identity-options{border-top:1px solid var(--line);padding:18px 0 6px;display:grid;gap:12px;font-size:13px}.identity-options label{display:flex;align-items:center;gap:9px}.identity-options input{accent-color:#00b79a;width:16px;height:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.action{padding:13px 4px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-size:14px;font-weight:600}.action.primary{background:var(--accent);border-color:var(--accent)}.helper{margin-top:14px;color:#526174;font-size:11px;line-height:1.7}.future{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.future strong{font-size:13px;font-weight:600}.future p{font-size:12px}.status{font-size:12px;min-height:38px;margin-top:14px;color:#226342}.top-three .points-label{margin-top:17px}@media(max-width:780px){header{padding:22px 20px 16px;display:block}.design-note{max-width:none;font-size:11px}.layout{grid-template-columns:1fr;gap:16px;padding:0 20px 28px}.stage{padding:20px 12px}.poster{width:min(300px,100%)}.controls{padding:22px}.poster-content{font-size:90%}.year{font-size:11px}.identity{margin-top:15px}.avatar{width:54px;height:54px;font-size:25px;border-radius:18px}.crown{left:17px}.name{font-size:19px;margin-top:10px}.points-label{margin-top:18px;font-size:11px}.top-three .points-label{margin-top:12px}.points{font-size:57px}.motto{font-size:11px;margin-top:8px}.scan-panel{padding:7px 8px;gap:7px}.code-space{width:42px;height:42px}.scan-title{font-size:10px}.scan-caption{font-size:8px}.honor{font-size:10px;padding:4px 10px}.team{font-size:10px}.choice img{max-height:150px}.helper{font-size:11px}}
</style>
<header><div><div class="eyebrow">为每一次参与，留下纪念</div><h1>分享我的荣誉</h1></div><p class="design-note">交互设计预览 · 下方均为示例数据。<br>三款背景已制作，产品功能尚未接入。</p></header>
<main class="layout">
<div class="stage"><article class="poster" id="poster" data-theme="pitch" aria-label="荣誉海报预览"><div class="poster-content"><div class="year">2026 · 我的足球年度</div><div class="identity"><img class="crown" src="../../../../registration_system_mini/src/static/icons/lucide/member-crown.png" alt="会员皇冠"><div class="avatar">球</div></div><div class="name">示例队员</div><div class="team">示例球队</div><div class="points-label">年度参与积分</div><div class="points">94<small>分</small></div><div class="honor">年度活跃冠军</div><div class="motto">每一次参与，都值得记录</div><div class="scan-panel"><div class="code-space">小程序码<br>预留位置</div><div><div class="scan-title">扫码看我的荣誉</div><div class="scan-caption">加入这支球队 · 创建自己的球队</div></div></div></div></article></div>
<section class="controls"><h2>选一款喜欢的背景</h2><p class="caption">同一份荣誉，三种表达。基础背景永久免费。</p><div class="choices" role="group" aria-label="选择海报背景"><button class="choice" data-theme="pitch" aria-pressed="true"><img src="pitch.png" alt="清新绿茵背景"><span>绿茵日常</span><small>免费</small></button><button class="choice" data-theme="gold" aria-pressed="false"><img src="gold.png" alt="香槟金色球场背景"><span>荣耀金</span><small>免费</small></button><button class="choice" data-theme="night" aria-pressed="false"><img src="night.png" alt="夜场灯光背景"><span>夜场聚光</span><small>免费</small></button></div><div class="identity-options"><label><input id="member" type="checkbox">预览会员皇冠</label><label><input id="honor" type="checkbox">预览前三名荣誉</label></div><div class="actions"><button class="action" id="send">发给朋友</button><button class="action primary" id="save">保存海报</button></div><p class="helper">朋友卡片打开荣誉页；保存海报后可分享朋友圈。<br>皇冠、称号和积分以真实数据为准；示意码不可扫描。</p><div class="status" id="status" aria-live="polite">当前背景：绿茵日常</div><div class="future"><strong>后续可扩展</strong><p>精品背景、个人上传背景。免费款继续保留，收费与上传入口本期不展示在小程序中。</p></div></section>
</main>
<script>
const poster=document.getElementById('poster'),status=document.getElementById('status');
document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>{poster.dataset.theme=button.dataset.theme;document.querySelectorAll('.choice').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));status.textContent='当前背景：'+button.querySelector('span').textContent}));
document.getElementById('member').addEventListener('change',event=>poster.classList.toggle('member',event.target.checked));
document.getElementById('honor').addEventListener('change',event=>poster.classList.toggle('top-three',event.target.checked));
document.getElementById('send').addEventListener('click',()=>status.textContent='设计说明：正式功能将打开微信转发，朋友进入荣誉展示页。');
document.getElementById('save').addEventListener('click',()=>status.textContent='设计说明：正式功能将合成真实数据与小程序码，再保存到相册。');
</script>
</html>
