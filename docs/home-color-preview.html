<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页配色静态稿</title>
    <style>
      :root {
        --page: #f5f7f1;
        --surface: #fffdf8;
        --surface-soft: #edf3e4;
        --ink: #172018;
        --ink-soft: #5f685b;
        --pitch: #162017;
        --pitch-2: #223120;
        --grass: #9be22b;
        --grass-bright: #b9f24b;
        --grass-soft: #eff8de;
        --coral: #ed6a5a;
        --coral-soft: #fff0ef;
        --blue: #5b70d6;
        --blue-soft: #edf0ff;
        --line: #dfe7d8;
        --shadow: rgba(43, 55, 38, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e7e9e2;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }

      .phone {
        width: 390px;
        height: 844px;
        overflow: hidden;
        border-radius: 42px;
        background:
          radial-gradient(circle at 18% 8%, rgba(155, 226, 43, 0.2), transparent 24%),
          linear-gradient(180deg, #ffffff 0%, var(--page) 42%, #eef2e9 100%);
        box-shadow: 0 30px 90px rgba(26, 31, 24, 0.22);
        position: relative;
      }

      .notch {
        position: absolute;
        left: 89px;
        top: 0;
        width: 202px;
        height: 32px;
        border-radius: 0 0 20px 20px;
        background: #050605;
        z-index: 5;
      }

      .status {
        height: 52px;
        padding: 20px 22px 0;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 700;
      }

      .nav {
        height: 72px;
        padding: 18px 26px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .nav-title {
        font-size: 23px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .nav-loc {
        color: var(--ink-soft);
        font-size: 13px;
        margin-left: 8px;
      }

      .mini-menu {
        width: 92px;
        height: 34px;
        border-radius: 999px;
        border: 1px solid rgba(23, 32, 24, 0.16);
        background: rgba(255, 253, 248, 0.8);
        display: flex;
        align-items: center;
        justify-content: space-around;
        font-weight: 900;
      }

      .content {
        padding: 0 16px 120px;
      }

      .banner {
        position: relative;
        height: 120px;
        overflow: hidden;
        border-radius: 18px;
        padding: 20px 20px;
        background:
          radial-gradient(circle at 28% 42%, rgba(185, 242, 75, 0.18), transparent 34%),
          linear-gradient(135deg, var(--pitch) 0%, var(--pitch-2) 100%);
        box-shadow: 0 18px 34px rgba(31, 47, 28, 0.18);
      }

      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 8px 8px;
      }

      .banner-title,
      .banner-sub,
      .banner-button,
      .goal,
      .ball,
      .net {
        position: relative;
        z-index: 1;
      }

      .banner-title {
        display: block;
        color: #fffdf8;
        font-size: 30px;
        line-height: 1;
        font-weight: 950;
      }

      .banner-sub {
        display: block;
        margin-top: 12px;
        color: var(--grass-bright);
        font-size: 16px;
        font-weight: 900;
      }

      .banner-button {
        margin-top: 14px;
        width: 72px;
        height: 32px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--grass);
        color: #152012;
        font-weight: 900;
        font-size: 14px;
      }

      .goal {
        position: absolute;
        right: 86px;
        top: 22px;
        color: var(--grass-bright);
        font-size: 15px;
        font-weight: 950;
        transform: rotate(-8deg);
      }

      .net {
        position: absolute;
        right: 16px;
        top: 12px;
        width: 72px;
        height: 74px;
        opacity: 0.78;
        background:
          linear-gradient(120deg, transparent 0 18%, rgba(255, 253, 248, 0.86) 18% 20%, transparent 20% 40%, rgba(255, 253, 248, 0.86) 40% 42%, transparent 42% 64%, rgba(255, 253, 248, 0.86) 64% 66%, transparent 66%),
          linear-gradient(90deg, transparent 0 24%, rgba(255, 253, 248, 0.86) 24% 26%, transparent 26% 54%, rgba(255, 253, 248, 0.86) 54% 56%, transparent 56%);
      }

      .ball {
        position: absolute;
        right: 34px;
        bottom: -20px;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 33%, #ffffff 0%, #f4f2ea 43%, #1c231d 44%, #1c231d 52%, #e6e4dc 53%, #ffffff 68%, #d6d6d0 100%);
        box-shadow: inset -12px -14px 22px rgba(0, 0, 0, 0.18);
      }

      .section {
        margin-top: 22px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }

      .section-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .fire {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff0df;
        color: #e86d37;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 950;
      }

      .section-title {
        font-size: 21px;
        line-height: 1;
        font-weight: 950;
      }

      .section-link {
        font-size: 15px;
        font-weight: 900;
        color: var(--ink);
      }

      .match-card {
        margin-top: 14px;
        padding: 12px 12px 12px 10px;
        border-radius: 20px;
        background: var(--surface);
        display: flex;
        gap: 12px;
        box-shadow: 0 18px 40px var(--shadow);
        border: 1px solid rgba(223, 231, 216, 0.8);
      }

      .date-rail {
        width: 80px;
        min-height: 184px;
        padding: 13px 8px;
        border-radius: 17px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(180deg, #172018 0%, #202a1f 100%);
        color: #fffdf8;
      }

      .month {
        font-size: 17px;
        font-weight: 800;
        opacity: 0.9;
      }

      .weekday {
        margin-top: 8px;
        font-size: 30px;
        font-weight: 950;
      }

      .time-chip {
        margin-top: auto;
        width: 64px;
        min-height: 62px;
        border-radius: 15px;
        background: var(--grass);
        color: #152012;
        display: grid;
        place-items: center;
        padding: 8px 4px;
      }

      .time-chip strong {
        font-size: 22px;
        line-height: 1;
      }

      .time-chip span {
        font-size: 11px;
        font-weight: 900;
      }

      .match-main {
        flex: 1;
        min-width: 0;
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .match-title {
        flex: 1;
        font-size: 17px;
        font-weight: 950;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tags {
        display: flex;
        gap: 6px;
      }

      .tag {
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 900;
        white-space: nowrap;
      }

      .tag-dark {
        background: var(--pitch);
        color: var(--grass-bright);
      }

      .tag-coral {
        background: var(--coral-soft);
        color: #d85d6a;
      }

      .meta {
        display: block;
        margin-top: 8px;
        color: var(--ink-soft);
        font-size: 14px;
        font-weight: 700;
      }

      .progress-head {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 900;
      }

      .track {
        position: relative;
        margin-top: 8px;
        height: 9px;
        border-radius: 999px;
        overflow: hidden;
        background: #e3ebdc;
      }

      .fill {
        width: 12%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--grass) 0%, var(--grass-bright) 100%);
      }

      .avatars {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-soft);
        font-size: 14px;
        font-weight: 800;
      }

      .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid #fffdf8;
        background: conic-gradient(from 45deg, #76c7b7, #ed6a5a, #f3c969, #76c7b7);
      }

      .bottom-row {
        margin-top: 11px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .status-pill {
        padding: 8px 11px;
        border-radius: 999px;
        background: var(--grass-soft);
        color: #3c681b;
        font-size: 13px;
        font-weight: 900;
      }

      .cta {
        min-width: 78px;
        height: 34px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--pitch);
        color: #fffdf8;
        font-size: 15px;
        font-weight: 950;
      }

      .opportunity {
        margin-top: 22px;
      }

      .caption {
        margin-top: 8px;
        color: var(--ink-soft);
        font-size: 14px;
        font-weight: 700;
      }

      .tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 84px;
        border-top: 1px solid rgba(223, 231, 216, 0.8);
        background: rgba(255, 253, 248, 0.92);
        backdrop-filter: blur(18px);
        display: flex;
        align-items: center;
        justify-content: space-around;
        color: #8a9185;
        font-size: 12px;
        font-weight: 900;
      }

      .tab {
        display: grid;
        gap: 5px;
        place-items: center;
      }

      .tab-icon {
        font-size: 22px;
      }

      .tab.active {
        color: var(--pitch);
      }

      .create {
        width: 58px;
        height: 58px;
        margin-top: -26px;
        border-radius: 50%;
        background: var(--grass);
        color: var(--pitch);
        font-size: 32px;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 24px rgba(155, 226, 43, 0.34);
      }
    </style>
  </head>
  <body>
    <main class="phone">
      <div class="notch"></div>
      <div class="status">
        <span>17:50</span>
        <span>80%</span>
      </div>
      <div class="nav">
        <div>
          <span class="nav-title">首页</span>
          <span class="nav-loc">· 点击定位⌄</span>
        </div>
        <div class="mini-menu">••• ◎</div>
      </div>

      <section class="content">
        <div class="banner">
          <span class="banner-title">约球开踢</span>
          <span class="banner-sub">组队 · 报名 · 上场</span>
          <div class="banner-button">去看看</div>
          <div class="goal">GOAL!</div>
          <div class="net"></div>
          <div class="ball"></div>
        </div>

        <div class="section">
          <div class="section-left">
            <div class="fire">热</div>
            <div class="section-title">最近要处理的比赛</div>
          </div>
          <div class="section-link">全部比赛</div>
        </div>

        <article class="match-card">
          <aside class="date-rail">
            <div class="month">05/16</div>
            <div class="weekday">周六</div>
            <div class="time-chip">
              <strong>20:00</strong>
              <span>截止报名</span>
            </div>
          </aside>
          <div class="match-main">
            <div class="title-row">
              <div class="match-title">周三晚球队约队</div>
              <div class="tags">
                <span class="tag tag-dark">比赛报名</span>
                <span class="tag tag-coral">报名中</span>
              </div>
            </div>
            <span class="meta">55</span>
            <span class="meta">8 人制 · 对手 等待对手</span>
            <div class="progress-head">
              <span>报名进度</span>
              <span>1/8</span>
            </div>
            <div class="track"><div class="fill"></div></div>
            <div class="avatars">
              <div class="avatar"></div>
              <span>还差 7 人</span>
            </div>
            <div class="bottom-row">
              <span class="status-pill">我的状态：参加</span>
              <span class="cta">去报名</span>
            </div>
          </div>
        </article>

        <article class="match-card">
          <aside class="date-rail">
            <div class="month">05/15</div>
            <div class="weekday">周五</div>
            <div class="time-chip">
              <strong>20:00</strong>
              <span>截止报名</span>
            </div>
          </aside>
          <div class="match-main">
            <div class="title-row">
              <div class="match-title">嘻嘻嘻</div>
              <div class="tags">
                <span class="tag tag-dark">比赛报名</span>
                <span class="tag tag-coral">报名中</span>
              </div>
            </div>
            <span class="meta">77777</span>
            <span class="meta">8 人制 · 对手 888</span>
            <div class="progress-head">
              <span>报名进度</span>
              <span>1/8</span>
            </div>
            <div class="track"><div class="fill"></div></div>
            <div class="avatars">
              <div class="avatar"></div>
              <span>还差 7 人</span>
            </div>
            <div class="bottom-row">
              <span class="status-pill">我的状态：参加</span>
              <span class="cta">去报名</span>
            </div>
          </div>
        </article>

        <div class="section opportunity">
          <div>
            <div class="section-title">约队机会</div>
            <div class="caption">只看当前球队值得优先关注的真实约队。</div>
          </div>
          <div class="section-link">进入大厅</div>
        </div>
      </section>

      <nav class="tabbar">
        <div class="tab active"><div class="tab-icon">⌂</div><div>首页</div></div>
        <div class="tab"><div class="tab-icon">◎</div><div>约队</div></div>
        <div class="create">+</div>
        <div class="tab"><div class="tab-icon">▥</div><div>统计</div></div>
        <div class="tab"><div class="tab-icon">♙</div><div>我的</div></div>
      </nav>
    </main>
  </body>
</html>
