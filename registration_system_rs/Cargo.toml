[package]
name = "registration_system_backend"
version = "0.1.0"
edition = "2024"
default-run = "registration_system_backend"

[lib]
name = "registration_system_backend"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["local-offset", "macros"] }
bcrypt = "0.15"
jsonwebtoken = "9"
rust_decimal = { version = "1", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
aws-config = "=1.5.16"
aws-sdk-s3 = "=1.66.0"
rand = "0.8"
md5 = "0.7"
regex = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
