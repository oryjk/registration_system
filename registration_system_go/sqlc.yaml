version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/auth.sql
    gen:
      go:
        package: authsqlc
        out: internal/auth/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/team.sql
    gen:
      go:
        package: teamsqlc
        out: internal/team/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/match.sql
    gen:
      go:
        package: matchsqlc
        out: internal/match/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/system.sql
    gen:
      go:
        package: systemsqlc
        out: internal/system/adapters/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
