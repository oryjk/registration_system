openapi: 3.0.3
info:
  title: Registration System Go API
  version: 1.0.0
  description: 赛事报名与球队管理 Go 后端 HTTP API。
servers:
  - url: http://127.0.0.1:18080
    description: 本地开发服务
tags:
  - name: System
  - name: App Auth
  - name: App Users
  - name: App Teams
  - name: App Matches
  - name: App Registrations
  - name: App Team Applications
  - name: App Payments
  - name: App Wallet
  - name: Admin Auth
  - name: Admin Users
  - name: Admin Teams
  - name: Admin Matches
  - name: Admin Team Applications
  - name: Admin Payments
  - name: Admin Wallets
  - name: Webhooks

x-bearer-security: &bearerSecurity
  - bearerAuth: []
x-standard-errors: &standardErrors
  "401":
    $ref: "#/components/responses/Unauthorized"
  "403":
    $ref: "#/components/responses/Forbidden"
  "404":
    $ref: "#/components/responses/NotFound"
  "409":
    $ref: "#/components/responses/Conflict"
  "422":
    $ref: "#/components/responses/ValidationError"
  "500":
    $ref: "#/components/responses/InternalError"

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/app/auth/wechat/login:
    post:
      operationId: loginAppWithWechat
      tags: [App Auth]
      summary: 微信登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/WechatLoginSuccess"
        <<: *standardErrors

  /api/v1/app/test-auth/users:
    get:
      operationId: listH5TestLoginUsers
      tags: [App Auth]
      summary: 列出 H5 测试登录账号
      description: 仅用于 development/test 环境，且必须配置 ENABLE_H5_TEST_LOGIN=true 才会注册该接口。
      security: []
      responses:
        "200":
          description: 可选测试账号列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestLoginUsersEnvelope"
        <<: *standardErrors

  /api/v1/app/test-auth/login:
    post:
      operationId: loginAppAsH5TestUser
      tags: [App Auth]
      summary: 使用 H5 测试账号登录
      description: 仅用于 development/test 环境，且必须配置 ENABLE_H5_TEST_LOGIN=true 才会注册该接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/WechatLoginSuccess"
        <<: *standardErrors

  /api/v1/app/system/mini-app-runtime-config:
    get:
      operationId: getMiniAppRuntimeConfig
      tags: [App System]
      summary: 查询小程序运行配置
      description: 小程序启动时拉取的运行配置（首页卡片数量、签到默认参数等）。当前返回与小程序内置默认值一致的静态配置，无需登录。
      security: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiniAppRuntimeConfigEnvelope"
        <<: *standardErrors

  /api/v1/app/users/me:
    get:
      operationId: getCurrentAppUser
      tags: [App Users]
      summary: 获取当前用户资料
      security: *bearerSecurity
      responses:
        "200":
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        <<: *standardErrors
    patch:
      operationId: updateCurrentAppUser
      tags: [App Users]
      summary: 更新当前用户资料
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: 更新后的用户资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEnvelope"
        <<: *standardErrors

  /api/v1/app/teams/my:
    get:
      operationId: listCurrentUserTeams
      tags: [App Teams]
      summary: 获取当前用户的球队
      security: *bearerSecurity
      responses:
        "200":
          description: 球队成员关系列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembershipListEnvelope"
        <<: *standardErrors

  /api/v1/app/teams/{id}:
    get:
      operationId: getAppTeam
      tags: [App Teams]
      summary: 获取球队详情
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: 球队详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTeamDetailEnvelope"
        <<: *standardErrors
    patch:
      operationId: updateAppTeamProfile
      tags: [App Teams]
      summary: 更新球队资料（队长/领队）
      description: 仅该队 active 的队长或领队可操作。name 不传则保持不变，传入时必须非空且不超过 120 字符；description/logo_url 传空串或 null 视为清除。球队 status（冻结/激活）不可通过此接口修改。
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, nullable: true }
                logo_url: { type: string, nullable: true }
      responses:
        "200":
          description: 更新成功（空 data）
        <<: *standardErrors

  /api/v1/app/teams/{id}/members:
    get:
      operationId: listAppTeamMembers
      tags: [App Teams]
      summary: 获取球队成员
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: 球队成员列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTeamMemberListEnvelope"
        <<: *standardErrors
    post:
      operationId: addAppTeamMember
      tags: [App Teams]
      summary: 添加球队成员（队长/领队）
      description: 仅该队 active 的队长或领队可操作。role 仅支持 leader/vice_captain/member（缺省为 member），不能直接指定队长；目标用户必须存在且为 active。
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer, format: int64 }
                role: { type: string, enum: [leader, vice_captain, member] }
      responses:
        "200":
          description: 添加成功（空 data）
        <<: *standardErrors

  /api/v1/app/teams/{id}/members/{user_id}:
    patch:
      operationId: updateAppTeamMember
      tags: [App Teams]
      summary: 修改球队成员角色/状态（队长/领队）
      description: 仅该队 active 的队长或领队可操作。role/status 至少传一个；role 仅支持 leader/vice_captain/member；目标成员为队长本人时返回 409，请使用移交队长。
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: user_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [leader, vice_captain, member] }
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: 修改成功（空 data）
        <<: *standardErrors
    delete:
      operationId: removeAppTeamMember
      tags: [App Teams]
      summary: 移除球队成员（队长/领队）
      description: 仅该队 active 的队长或领队可操作。队长本人不可移除，返回 409。
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: user_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 移除成功（空 data）
        <<: *standardErrors

  /api/v1/app/teams/{id}/members/{user_id}/attendance:
    get:
      operationId: getAppTeamMemberAttendance
      tags: [App Teams]
      summary: 获取队员比赛出勤明细（队长/领队）
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: user_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: 队员在全部已结束比赛中的出勤明细
        <<: *standardErrors

  /api/v1/app/teams/{id}/attendance-summary:
    get:
      operationId: getAppTeamAttendanceSummary
      tags: [App Teams]
      summary: 获取球队出勤摘要（我的记录 + 全队排名，队员可看）
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: 当前队员的出勤记录与全队出勤排名
        <<: *standardErrors

  /api/v1/app/teams/{id}/matches/{match_id}/attendance:
    get:
      operationId: getAppTeamMatchAttendance
      tags: [App Teams]
      summary: 获取单场比赛的全队出勤（队长/领队，仅在职成员）
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - name: match_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 该场比赛全体在职成员的报名与出勤状态
        <<: *standardErrors

  /api/v1/app/payments/team-membership-orders:
    post:
      operationId: createAppTeamMembershipOrder
      tags: [App Payments]
      summary: 为球队创建队费订单并发起微信支付
      description: 仅该队队长/领队可操作；金额由用户填写（单位分，上限 100 万分），支付成功后金额计入付款人在该球队的个人账户余额，与球队公共数据、信用分、会员时长无关。
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team_id, amount_cents]
              properties:
                team_id: { type: integer, format: int64 }
                amount_cents: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
      responses:
        "200":
          description: 订单与微信支付参数
        <<: *standardErrors

  /api/v1/app/matches:
    get:
      operationId: listAppMatches
      tags: [App Matches]
      summary: 获取用户端比赛列表
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchScope"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/MatchStatus"
        - $ref: "#/components/parameters/StartsAfter"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 分页比赛列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMatchListEnvelope"
        <<: *standardErrors
    post:
      operationId: createAppMatch
      tags: [App Matches]
      summary: 创建用户端比赛
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchRequest"
      responses:
        "200":
          description: 创建后的用户端比赛详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMatchDetailEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/home:
    get:
      operationId: getAppMatchHome
      tags: [App Matches]
      summary: 获取用户端比赛首页
      security: *bearerSecurity
      responses:
        "200":
          description: 待处理和已结束比赛摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMatchHomeEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}:
    get:
      operationId: getAppMatch
      tags: [App Matches]
      summary: 获取用户端比赛详情
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: 比赛与当前用户报名状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMatchDetailEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}/status:
    patch:
      operationId: finishAppMatch
      tags: [App Matches]
      summary: 主队/客队管理方收尾比赛（已结束/已取消）
      description: 比赛需已过结束时间；主队队长或领队可用，线上约队已确认对手时客队队长或领队同样可用；状态只允许 ended / cancelled。
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchStatusRequest"
      responses:
        "200":
          description: 收尾后的比赛详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMatchDetailEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}/groups/{group_id}/my-registration:
    put:
      operationId: putMyMatchRegistration
      tags: [App Registrations]
      summary: 创建或更新我的报名
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyRegistrationRequest"
      responses:
        "200":
          description: 当前报名结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRegistrationEnvelope"
        <<: *standardErrors
    delete:
      operationId: deleteMyMatchRegistration
      tags: [App Registrations]
      summary: 取消我的报名
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: 取消后的报名记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRegistrationEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}/team-applications:
    get:
      operationId: listAppTeamApplications
      tags: [App Team Applications]
      summary: 获取比赛球队申请
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
      responses:
        "200":
          description: 球队申请列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamApplicationListEnvelope"
        <<: *standardErrors
    post:
      operationId: createAppTeamApplication
      tags: [App Team Applications]
      summary: 提交球队申请
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamApplicationRequest"
      responses:
        "200":
          description: 创建的球队申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamApplicationEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}/team-applications/{application_id}/select:
    post:
      operationId: selectAppTeamApplication
      tags: [App Team Applications]
      summary: 选中球队申请
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: 更新后的球队申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamApplicationEnvelope"
        <<: *standardErrors

  /api/v1/app/matches/{id}/team-applications/{application_id}/withdraw:
    post:
      operationId: withdrawAppTeamApplication
      tags: [App Team Applications]
      summary: 撤回球队申请
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/MatchID"
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: 更新后的球队申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamApplicationEnvelope"
        <<: *standardErrors

  /api/v1/app/payments/recharge-orders:
    post:
      operationId: createAppRechargeOrder
      tags: [App Payments]
      summary: 创建微信小程序充值订单
      description: 金额单位为分，最小 1 分；openid 从当前 JWT 用户读取。
      security: *bearerSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRechargeRequest"
      responses:
        "200":
          description: 本地订单与小程序 requestPayment 参数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRechargeEnvelope"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        <<: *standardErrors

  /api/v1/app/payments/orders:
    get:
      operationId: listAppPaymentOrders
      tags: [App Payments]
      summary: 查询当前用户的充值订单
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PaymentStatus"
      responses:
        "200":
          description: 当前用户的充值订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderListEnvelope"
        <<: *standardErrors

  /api/v1/app/payments/orders/{order_no}:
    get:
      operationId: getAppPaymentOrder
      tags: [App Payments]
      summary: 查询当前用户的充值订单详情
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/PaymentOrderNo"
      responses:
        "200":
          description: 充值订单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderEnvelope"
        <<: *standardErrors

  /api/v1/app/payments/orders/{order_no}/sync:
    post:
      operationId: syncAppPaymentOrder
      tags: [App Payments]
      summary: 向微信同步订单并幂等充值
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/PaymentOrderNo"
      responses:
        "200":
          description: 同步后的订单与余额
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettlementEnvelope"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        <<: *standardErrors

  /api/v1/app/payments/orders/{order_no}/cancel:
    post:
      operationId: cancelAppPaymentOrder
      tags: [App Payments]
      summary: 关闭微信订单后取消本地未支付订单
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/PaymentOrderNo"
      responses:
        "200":
          description: 取消后的订单；若微信已支付则返回结算后的 paid 订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrderEnvelope"
        "502":
          $ref: "#/components/responses/PaymentProviderError"
        <<: *standardErrors

  /api/v1/app/wallet:
    get:
      operationId: getAppWallet
      tags: [App Wallet]
      summary: 查询当前用户钱包
      security: *bearerSecurity
      responses:
        "200":
          description: 钱包账户；尚无资金记录时余额为 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletAccountEnvelope"
        <<: *standardErrors

  /api/v1/app/wallet/transactions:
    get:
      operationId: listAppWalletTransactions
      tags: [App Wallet]
      summary: 查询当前用户资金流水
      security: *bearerSecurity
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 不可变资金流水
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionListEnvelope"
        <<: *standardErrors

  /api/v1/webhooks/wechat-pay:
    post:
      operationId: handleWechatPayV2Notification
      tags: [Webhooks]
      summary: 处理微信支付 V2 结果通知
      description: 公共入口，但请求必须通过微信 V2 MD5 验签和商户、金额校验。
      security: []
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
              description: 微信支付 V2 XML 通知
      responses:
        "200":
          description: 微信支付 V2 SUCCESS 或 FAIL XML
          content:
            application/xml:
              schema:
                type: string
                example: <xml><return_code>SUCCESS</return_code><return_msg>OK</return_msg></xml>

  /api/v1/admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [Admin Auth]
      summary: 管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: 管理员令牌与资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginEnvelope"
        <<: *standardErrors

  /api/v1/admin/auth/me:
    get:
      operationId: getCurrentAdmin
      tags: [Admin Auth]
