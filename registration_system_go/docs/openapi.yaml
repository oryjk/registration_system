components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TeamID:
      name: id
      in: path
      required: true
      description: 球队 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    UserID:
      name: user_id
      in: path
      required: true
      description: 用户 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    UserIDAsID:
      name: id
      in: path
      required: true
      description: 用户 ID
      schema:
        type: integer
        format: int64
        minimum: 1
    MatchID:
      name: id
      in: path
      required: true
      description: 比赛 UUID
      schema:
        type: string
        format: uuid
    GroupID:
      name: group_id
      in: path
      required: true
      description: 报名组 UUID
      schema:
        type: string
        format: uuid
    ApplicationID:
      name: application_id
      in: path
      required: true
      description: 球队申请 UUID
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: 页码
      schema:
        type: integer
        format: int32
        minimum: 1
    PageSize:
      name: page_size
      in: query
      description: 每页数量
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      description: 名称或用户关键词
      schema:
        type: string
    MatchStatus:
      name: status
      in: query
      description: 比赛状态
      schema:
        $ref: "#/components/schemas/MatchStatus"
    TeamStatus:
      name: status
      in: query
      description: 球队状态
      schema:
        $ref: "#/components/schemas/TeamStatus"
    MatchScope:
      name: scope
      in: query
      description: 比赛范围
      schema:
        type: string
        enum: [all, mine, others]
    StartsAfter:
      name: starts_after
      in: query
      description: 仅返回开始时间晚于该时间的比赛
      schema:
        type: string
        format: date-time
    PaymentOrderNo:
      name: order_no
      in: path
      required: true
      description: 充值订单号
      schema:
        type: string
        minLength: 1
        maxLength: 32
    PaymentStatus:
      name: status
      in: query
      description: 支付订单状态
      schema:
        $ref: "#/components/schemas/PaymentStatus"

  responses:
    WechatLoginSuccess:
      description: 登录成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WechatLoginEnvelope"
    Unauthorized:
      description: 未登录或令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 资源状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: 请求参数或业务输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PaymentProviderError:
      description: 微信支付上游网络、协议、签名或业务错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    SuccessBase:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          enum: [0]
        message:
          type: string
          example: ok
    ErrorResponse:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: integer
          format: int32
          example: 422
        message:
          type: string
        data:
          nullable: true
    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ok]

    PublicationMode:
      type: string
      enum: [offline_confirmed, online_team, online_individual]
    OpponentState:
      type: string
      enum: [no_recruitment, recruiting, confirmed]
    MatchStatus:
      type: string
      enum: [registering, ongoing, ended, cancelled]
    GroupKind:
      type: string
      enum: [host_team, guest_team, individual_opponent]
    GroupStatus:
      type: string
      enum: [open, closed, cancelled]
    RegistrationStatus:
      type: string
      enum: [unknown, attending, leave, absent, cancelled]
    WritableRegistrationStatus:
      type: string
      enum: [attending, leave, absent]
    ApplicationStatus:
      type: string
      enum: [pending, selected, rejected, withdrawn]
    TeamStatus:
      type: string
      enum: [active, frozen]
    MemberStatus:
      type: string
      enum: [active, inactive]
    MemberRole:
      type: string
      enum: [captain, leader, vice_captain, member]
    AdminRole:
      type: string
      enum: [admin, super_admin]
    PaymentStatus:
      type: string
      enum: [pending, paid, cancelled, failed]
    WalletDirection:
      type: string
      enum: [credit, debit]
    WalletTransactionType:
      type: string
      enum: [recharge, spend]

    CreateRechargeRequest:
      type: object
      required: [amount_cents]
      properties:
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: 充值金额，单位为分
    MiniProgramPaymentParameters:
      type: object
      required: [app_id, time_stamp, nonce_str, package, sign_type, pay_sign]
      properties:
        app_id:
          type: string
        time_stamp:
          type: string
        nonce_str:
          type: string
        package:
          type: string
          example: prepay_id=wx201410272009395522657a690389285100
        sign_type:
          type: string
          enum: [MD5]
        pay_sign:
          type: string
    PaymentOrder:
      type: object
      required: [order_no, user_id, amount_cents, provider, channel, status, created_at, updated_at]
      properties:
        order_no:
          type: string
        user_id:
          type: integer
          format: int64
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        provider:
          type: string
          enum: [wechat]
        channel:
          type: string
          enum: [mini_program_jsapi]
        status:
          $ref: "#/components/schemas/PaymentStatus"
        prepay_id:
          type: string
        transaction_id:
          type: string
        paid_at:
          type: string
          format: date-time
        cancelled_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentOrderList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOrder"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
    CreateRechargeResult:
      type: object
      required: [order, payment]
      properties:
        order:
          $ref: "#/components/schemas/PaymentOrder"
        payment:
          $ref: "#/components/schemas/MiniProgramPaymentParameters"
    PaymentSettlement:
      type: object
      required: [order, balance_cents, credited]
      properties:
        order:
          $ref: "#/components/schemas/PaymentOrder"
        balance_cents:
          type: integer
          format: int64
          minimum: 0
        credited:
          type: boolean
    WalletAccount:
      type: object
      required: [user_id, balance_cents, total_recharged_cents, total_spent_cents, version]
      properties:
        user_id:
          type: integer
          format: int64
        balance_cents:
          type: integer
          format: int64
          minimum: 0
        total_recharged_cents:
          type: integer
          format: int64
          minimum: 0
        total_spent_cents:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WalletTransaction:
      type: object
      required: [id, direction, type, amount_cents, balance_after_cents, source_type, source_id, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/WalletDirection"
        type:
          $ref: "#/components/schemas/WalletTransactionType"
        amount_cents:
          type: integer
          format: int64
          minimum: 1
        balance_after_cents:
          type: integer
          format: int64
          minimum: 0
        source_type:
          type: string
        source_id:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    WalletTransactionList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32

    WechatLoginRequest:
      type: object
      required: [js_code]
      properties:
        js_code:
          type: string
          minLength: 1
    MiniAppRuntimeConfigEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MiniAppRuntimeConfig"
    MiniAppRuntimeConfig:
      type: object
      description: 小程序运行配置；各分区字段与小程序端清洗规则一一对应。
      properties:
        home:
