<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111214">
  <title>赛事管理 Android</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f6;
      color: #17181a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f6;
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    header { margin-bottom: 28px; }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #686c73;
      font-size: 15px;
    }

    .download-panel {
      border: 1px solid #d9dce0;
      border-radius: 8px;
      background: #fff;
      padding: 22px;
    }

    .version-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .version-label {
      color: #686c73;
      font-size: 13px;
    }

    .version {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 700;
    }

    .build-type {
      flex: none;
      border-radius: 4px;
      background: #e3f4ec;
      color: #0b6b4b;
      padding: 5px 8px;
      font-size: 12px;
      font-weight: 650;
    }

    .download-button {
      display: flex;
      width: 100%;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #111214;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .download-button:focus-visible {
      outline: 3px solid #67a98f;
      outline-offset: 3px;
    }

    dl {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 11px 16px;
      margin: 24px 0 0;
      padding-top: 20px;
      border-top: 1px solid #e4e6e8;
      font-size: 13px;
    }

    dt { color: #686c73; }
    dd { margin: 0; overflow-wrap: anywhere; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

    .status {
      margin: 18px 0 0;
      color: #686c73;
      font-size: 13px;
    }

    .status.error { color: #b42318; }

    .release-notes {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #e4e6e8;
    }

    .release-notes h2,
    .history h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .release-note-list {
      margin: 12px 0 0;
      padding-left: 20px;
      color: #34373c;
      font-size: 14px;
      line-height: 1.65;
    }

    .release-notes h3 { margin: 18px 0 0; font-size: 14px; }

    .history {
      margin-top: 30px;
    }

    .history-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .history-item {
      border: 1px solid #d9dce0;
      border-radius: 6px;
      background: #fff;
      padding: 16px;
    }

    .history-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .history-version { font-size: 16px; font-weight: 700; }
    .history-time { color: #686c73; font-size: 12px; text-align: right; }
    .history-download { display: inline-block; margin-top: 12px; color: #17181a; font-size: 13px; font-weight: 650; }

    @media (max-width: 480px) {
      main { padding-top: 32px; }
      .download-panel { padding: 18px; }
      dl { grid-template-columns: 88px minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>赛事管理</h1>
      <p class="subtitle">面向赛事运营与管理员 · Android 安装包</p>
    </header>

    <section class="download-panel" aria-labelledby="version-heading">
      <div class="version-row">
        <div>
          <div class="version-label" id="version-heading">当前版本</div>
          <div class="version" id="version">读取中</div>
        </div>
        <span class="build-type" id="build-type">APK</span>
      </div>

      <a class="download-button" id="download" href="latest.apk" download>下载最新版本</a>
      <p class="status">内部测试版本，使用现有管理员账号登录。</p>

      <dl>
        <dt>发布时间</dt><dd id="published-at">-</dd>
        <dt>文件大小</dt><dd id="file-size">-</dd>
        <dt>版本代码</dt><dd id="version-code">-</dd>
        <dt>代码提交</dt><dd><code id="git-commit">-</code></dd>
        <dt>SHA256</dt><dd><code id="sha256">-</code></dd>
      </dl>

      <section class="release-notes" aria-labelledby="release-notes-heading">
        <h2 id="release-notes-heading">本次更新</h2>
        <div id="release-notes"><p class="status">正在读取发布说明</p></div>
      </section>
    </section>

    <p class="status" id="status" role="status">正在读取最新版本信息</p>

    <section class="history" id="history" aria-labelledby="history-heading" hidden>
      <h2 id="history-heading">历史版本</h2>
      <div class="history-list" id="history-list"></div>
    </section>
  </main>

  <script>
    const formatBytes = (bytes) => {
      if (!Number.isFinite(bytes) || bytes <= 0) return "-";
      const units = ["B", "KB", "MB", "GB"];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / (1024 ** index)).toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    };

    const formatTime = (value) => {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "-";
      return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).format(date) + "（北京时间）";
    };

    const releasePath = (value) => {
      if (typeof value !== "string" || !/^releases\/[a-zA-Z0-9._+-]+\.apk$/.test(value)) {
        throw new Error("安装包地址无效");
      }
      return value;
    };

    const renderNotes = (container, notes) => {
      container.replaceChildren();
      const normalized = Array.isArray(notes) && notes.length ? notes : ["暂无发布说明"];
      normalized.forEach((note) => {
        const item = document.createElement("li");
        item.textContent = String(note);
        container.append(item);
      });
    };

    const renderCurrentNotes = (notes) => {
      const container = document.querySelector("#release-notes");
      container.replaceChildren();
      const normalized = Array.isArray(notes) ? notes : [];
      [["新增功能", "新增："], ["问题修复", "修复："]].forEach(([title, prefix]) => {
        const heading = document.createElement("h3");
        heading.textContent = title;
        const list = document.createElement("ul");
        list.className = "release-note-list";
        const items = normalized.filter(note => typeof note === "string" && note.startsWith(prefix))
          .map(note => note.slice(prefix.length));
        renderNotes(list, items.length ? items : ["本版无此类更新"]);
        container.append(heading, list);
      });
    };

    const renderHistory = (releases) => {
      const history = document.querySelector("#history");
      const list = document.querySelector("#history-list");
      const previous = Array.isArray(releases) ? releases.slice(1) : [];
      list.replaceChildren();
      if (!previous.length) {
        history.hidden = true;
        return;
      }
      previous.forEach((release) => {
        const article = document.createElement("article");
        article.className = "history-item";
        const heading = document.createElement("div");
        heading.className = "history-heading";
        const version = document.createElement("span");
        version.className = "history-version";
        version.textContent = `v${release.versionName || "-"}`;
        const time = document.createElement("time");
        time.className = "history-time";
        time.textContent = formatTime(release.publishedAt);
        heading.append(version, time);
        const notes = document.createElement("ul");
        notes.className = "release-note-list";
        renderNotes(notes, release.releaseNotes);
        const download = document.createElement("a");
        download.className = "history-download";
        download.href = releasePath(release.releaseFile);
        download.textContent = "下载这个版本";
        download.setAttribute("download", "");
        article.append(heading, notes, download);
        list.append(article);
      });
      history.hidden = false;
    };

    Promise.all([
      fetch(`metadata.json?t=${Date.now()}`, { cache: "no-store" }),
      fetch(`releases.json?t=${Date.now()}`, { cache: "no-store" })
    ])
      .then(async ([metadataResponse, releasesResponse]) => {
        if (!metadataResponse.ok) throw new Error(`HTTP ${metadataResponse.status}`);
        const metadata = await metadataResponse.json();
        const releases = releasesResponse.ok ? await releasesResponse.json() : [metadata];
        return { metadata, releases };
      })
      .then(({ metadata, releases }) => {
        document.querySelector("#version").textContent = metadata.versionName || "-";
        document.querySelector("#version-code").textContent = metadata.versionCode || "-";
        document.querySelector("#build-type").textContent = (metadata.buildType || "APK").toUpperCase();
        document.querySelector("#published-at").textContent = formatTime(metadata.publishedAt);
        document.querySelector("#file-size").textContent = formatBytes(metadata.fileSizeBytes);
        document.querySelector("#git-commit").textContent = metadata.gitCommit ? metadata.gitCommit.slice(0, 12) : "-";
        document.querySelector("#sha256").textContent = metadata.sha256 || "-";
        document.querySelector("#download").href = releasePath(metadata.releaseFile);
        renderCurrentNotes(metadata.releaseNotes);
        renderHistory(releases);
        document.querySelector("#status").textContent = "最新版本已就绪";
      })
      .catch((error) => {
        const status = document.querySelector("#status");
        status.textContent = `版本信息读取失败：${error.message}`;
        status.classList.add("error");
      });
  </script>
</body>
</html>
