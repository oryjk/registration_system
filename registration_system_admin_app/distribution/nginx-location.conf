        location = /registration-admin-android {
            return 301 /registration-admin-android/;
        }

        location = /registration-admin-android/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            rewrite ^ /registration-admin-android/index.html last;
        }

        location = /registration-admin-android/index.html {
            default_type text/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            alias /usr/share/nginx/html/registration-admin-android/index.html;
        }

        location = /registration-admin-android/metadata.json {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            alias /usr/share/nginx/html/registration-admin-android/metadata.json;
        }

        location = /registration-admin-android/releases.json {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            alias /usr/share/nginx/html/registration-admin-android/releases.json;
        }

        location = /registration-admin-android/latest.apk {
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Content-Disposition "attachment; filename=registration-admin-android-latest.apk" always;
            alias /usr/share/nginx/html/registration-admin-android/latest.apk;
        }

        location ~ ^/registration-admin-android/releases/(.+\.apk)$ {
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            alias /usr/share/nginx/html/registration-admin-android/releases/$1;
        }
